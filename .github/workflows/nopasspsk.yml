# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml
name: GLM NO PAS

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "18.6"
        required: true
        type: string
      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: "https://www.dropbox.com/scl/fi/j8gc6moqvudfo8xetcf2o/YouTube.ipa?rlkey=h452vc9ky73935kcwqlozjxv5&dl=0"
        required: true
        type: string
      mobileprovision_url:
        description: "Direct URL to the .mobileprovision file"
        default: "https://flarestore.vip/api/cert/8e9160aa-414/provision/0?udid=00008150-0004056C0200401C"
        required: true
        type: string
      p12_url:
        description: "Direct URL to the .p12 certificate file"
        default: "https://flarestore.vip/api/cert/8e9160aa-414/p12?udid=00008150-0004056C0200401C"
        required: true
        type: string
      p12_password:
        description: "Password for the .p12 certificate"
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean
      ytuhd:
        description: "Include YTUHD"
        default: false
        required: false
        type: boolean
      sponsorblock:
        description: "Include iSponsorBlock (KEEP IT DISABLED - may crash the app.)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      # ============================================
      # STEP 1: VALIDATE CERTIFICATE EARLY (FAIL FAST)
      # ============================================
      - name: Validate Certificate and Profile Early
        
        id: validate_cert
        run: |
          set -euo pipefail
          echo "=== VALIDATING CERTIFICATE EARLY ==="

          # 1. Download files WITH STRICT ERROR HANDLING
          echo "Downloading certificate and profile..."
          # -f / --fail: fail silently on 4xx/5xx. -L: follow redirects. -s: silent. -S: show errors. -o: output.
          curl -fL -sS --max-redirs 5 -o cert.p12 "${{ inputs.p12_url }}"
          curl -fL -sS --max-redirs 5 -o profile.mobileprovision "${{ inputs.mobileprovision_url }}"

          # 2. Verify downloads are non-empty
          [ -s cert.p12 ] || { echo "❌ cert.p12 is empty (download failed)"; exit 1; }
          [ -s profile.mobileprovision ] || { echo "❌ profile.mobileprovision is empty (download failed)"; exit 1; }

          # 3. Strict File Type Verification (Magic Bytes)
          # .mobileprovision MUST be ASN.1 (DER) / PKCS#7. 'file' reports "data" or "PKCS#7".
          # If it reports "HTML", "XML", "JSON", "ASCII text" -> IT IS CORRUPT/ERROR PAGE.
          echo "=== Verifying File Magic Bytes ==="
          CERT_TYPE=$(file -b cert.p12)
          PROV_TYPE=$(file -b profile.mobileprovision)
          echo "Cert type: $CERT_TYPE"
          echo "Prov type: $PROV_TYPE"

          if echo "$CERT_TYPE" | grep -qiE "html|xml|json|text|script"; then
            echo "❌ Certificate is TEXT/HTML (Error page). First 500 bytes:"
            head -c 500 cert.p12 | cat -v
            exit 1
          fi
          if echo "$PROV_TYPE" | grep -qiE "html|xml|json|text|script"; then
            echo "❌ Profile is TEXT/HTML (Error page). First 500 bytes:"
            head -c 500 profile.mobileprovision | cat -v
            exit 1
          fi
          # Positive check for Provision: Must be ASN.1/DER/PKCS7
          if ! echo "$PROV_TYPE" | grep -qiE "pkcs|asn.1|der|data"; then
             echo "❌ Profile does not look like a binary PKCS#7/ASN.1 file (got: $PROV_TYPE)."
             exit 1
          fi
          echo "✅ Files are valid binary types"

          # 4. Provisioning Profile Validation (The Real Test)
          echo "=== Parsing Provisioning Profile ==="
          # security cms -D exits non-zero and prints to stderr on failure.
          # We capture stderr to show WHY it failed.
          if ! security cms -D -i profile.mobileprovision > provision.plist 2>cms_error.log; then
            echo "❌ 'security cms -D' failed. This file is NOT a valid .mobileprovision."
            echo "--- macOS Security Error ---"
            cat cms_error.log
            echo "--- File Header (Hex) ---"
            xxd -l 64 profile.mobileprovision
            exit 1
          fi

          if [ ! -s provision.plist ]; then
            echo "❌ Parsed plist is empty."
            exit 1
          fi

          # 5. Extract Metadata
          EXPIRATION=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' provision.plist 2>/dev/null || echo "Unknown")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' provision.plist 2>/dev/null || echo "Unknown")
          APP_ID_PREFIX=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' provision.plist 2>/dev/null || echo "")
          PROV_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' provision.plist 2>/dev/null || echo "")

          echo "Team ID: $TEAM_ID"
          echo "App ID Prefix: $APP_ID_PREFIX"
          echo "Provision Expiration: $EXPIRATION"
          echo "Provision App ID: $PROV_APP_ID"

          # Check Expiration
          if [[ "$EXPIRATION" != "Unknown" ]]; then
            EXP_EPOCH=$(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$EXPIRATION" "+%s" 2>/dev/null || date -d "$EXPIRATION" "+%s" 2>/dev/null)
            NOW_EPOCH=$(date "+%s")
            if [ "$EXP_EPOCH" -lt "$NOW_EPOCH" ]; then
              echo "❌ PROVISIONING PROFILE EXPIRED: $EXPIRATION"
              exit 1
            fi
            echo "✅ Profile is valid (expires $EXPIRATION)"
          fi

          
          # 4. Certificate Password Detection & Validation
          echo "=== Detecting Certificate Password ==="

          # Helper function to test password with OpenSSL (lenient)
          test_openssl() {
            local pass="$1"
            if [ -z "$pass" ]; then
              openssl pkcs12 -in cert.p12 -nokeys -clcerts -passin pass: 2>/dev/null
            else
              openssl pkcs12 -in cert.p12 -nokeys -clcerts -passin pass:"$pass" 2>/dev/null
            fi
          }

          # Helper function to test password with macOS security (strict)
          test_security_import() {
            local pass="$1"
            local test_keychain="test_keychain_$$"
            security create-keychain -p "temp" "$test_keychain" 2>/dev/null
            security unlock-keychain -p "temp" "$test_keychain" 2>/dev/null

            local result=0
            if [ -z "$pass" ]; then
              security import cert.p12 -k "$test_keychain" -T /usr/bin/codesign -A 2>/dev/null || result=1
            else
              security import cert.p12 -k "$test_keychain" -P "$pass" -T /usr/bin/codesign -A 2>/dev/null || result=1
            fi

            security delete-keychain "$test_keychain" 2>/dev/null
            return $result
          }

          # Candidate Passwords (Input first, then common defaults)
          INPUT_PASS="${{ inputs.p12_password }}"
          # Trim whitespace/newlines from input
          INPUT_PASS=$(printf '%s' "$INPUT_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          CANDIDATES=("$INPUT_PASS" "flarestore" "FlareStore" "flareStore" "FLARESTORE" "FlareStore123" "123456" "password" "1234" "0000" "")

          FOUND_PASS=""
          FOUND_METHOD=""

          for PASS in "${CANDIDATES[@]}"; do
            echo "Trying password: '${PASS:- (empty)}' ..."

            # Test with OpenSSL first (fast)
            if test_openssl "$PASS"; then
              echo "  -> OpenSSL OK. Testing macOS security import..."
              if test_security_import "$PASS"; then
                echo "  ✅ SUCCESS with macOS security!"
                FOUND_PASS="$PASS"
                FOUND_METHOD="original"
                break
              else
                echo "  ⚠️ OpenSSL OK but macOS security FAILED (MAC verify error). Trying legacy conversion..."
                # Try converting to legacy PBE and test again
                TMP_PEM=$(mktemp)
                TMP_P12=$(mktemp)
                if openssl pkcs12 -in cert.p12 -out "$TMP_PEM" -nodes -passin pass:"$PASS" 2>/dev/null; then
                  if openssl pkcs12 -export -in "$TMP_PEM" -out "$TMP_P12" -passout pass:"$PASS" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES 2>/dev/null; then
                    # Test converted cert
                    local test_kc="test_kc_$$"
                    security create-keychain -p "temp" "$test_kc" 2>/dev/null
                    security unlock-keychain -p "temp" "$test_kc" 2>/dev/null
                    local conv_result=0
                    if [ -z "$PASS" ]; then
                      security import "$TMP_P12" -k "$test_kc" -T /usr/bin/codesign -A 2>/dev/null || conv_result=1
                    else
                      security import "$TMP_P12" -k "$test_kc" -P "$PASS" -T /usr/bin/codesign -A 2>/dev/null || conv_result=1
                    fi
                    security delete-keychain "$test_kc" 2>/dev/null

                    if [ $conv_result -eq 0 ]; then
                      echo "  ✅ SUCCESS with Legacy Conversion!"
                      FOUND_PASS="$PASS"
                      FOUND_METHOD="legacy"
                      mv "$TMP_P12" cert.p12  # Replace original with fixed version
                      break
                    fi
                  fi
                fi
                rm -f "$TMP_PEM" "$TMP_P12"
              fi
            fi
          done

          if [ -z "$FOUND_PASS" ] && [ -z "$FOUND_METHOD" ]; then
            echo "❌ ALL PASSWORD ATTEMPTS FAILED."
            echo "--- Certificate Info (OpenSSL Dump) ---"
            openssl pkcs12 -in cert.p12 -info -nokeys -passin pass: 2>&1 | head -30 || true
            exit 1
          fi

          echo "✅ Valid Password Found: '${FOUND_PASS:- (empty)}' (Method: $FOUND_METHOD)"
          printf '%s' "$FOUND_PASS" > cert_password.txt
          echo "FOUND_METHOD=$FOUND_METHOD" >> $GITHUB_ENV

          # 5. Verify Certificate Identity Type (Must be iOS, not Mac)
          echo "=== Verifying Certificate Type ==="
          # Import to temp keychain to inspect
          TMP_KC="verify_kc_$$"
          security create-keychain -p "temp" "$TMP_KC"
          security unlock-keychain -p "temp" "$TMP_KC"
          if [ -z "$FOUND_PASS" ]; then
            security import cert.p12 -k "$TMP_KC" -T /usr/bin/codesign -A
          else
            security import cert.p12 -k "$TMP_KC" -P "$FOUND_PASS" -T /usr/bin/codesign -A
          fi

          IDENTITY=$(security find-identity -v -p codesigning "$TMP_KC" | grep -E "iPhone Developer|iPhone Distribution|Apple Development|Apple Distribution" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')

          security delete-keychain "$TMP_KC" 2>/dev/null

          if [ -z "$IDENTITY" ]; then
            echo "❌ Certificate imported but NO VALID iOS SIGNING IDENTITY found."
            echo "   Found identities:"
            security find-identity -v -p codesigning "$TMP_KC" 2>/dev/null || true
            echo "   This cert might be a 'Mac Developer', 'Mac App Store', or 'Developer ID' cert."
            exit 1
          fi

          echo "✅ Valid iOS Signing Identity: $IDENTITY"
          echo "CERT_IDENTITY=$IDENTITY" >> $GITHUB_ENV

          # 6. Cache validated assets
          mkdir -p cert_cache
          cp cert.p12 cert_cache/
          cp profile.mobileprovision cert_cache/
          cp cert_password.txt cert_cache/

          echo "CERT_VALIDATED=true" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "=== EARLY VALIDATION PASSED ==="

      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make wget unzip jq pipx
      - name: Set PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: iOS-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/ sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout --quiet
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Fix Theos broken pipe issue
        run: |
          find $THEOS -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$SCRIPT" 2>/dev/null || true
              echo "Patched: $SCRIPT"
            fi
          done
          find $THEOS -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$MK" 2>/dev/null || true
              echo "Patched: $MK"
            fi
          done
          echo "Broken pipe fixes applied"
      - name: Install cyan and tbd
        run: |
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          wget --quiet "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd
          chmod +x /usr/local/bin/tbd
      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV
      - name: Prepare YouTube iPA
        id: prepare_youtube
        run: |
          wget "$YOUTUBE_URL" --quiet -O main/YouTube.ipa
          cd main
          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          youtube_version=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "YT_VERSION=$youtube_version" >> $GITHUB_ENV
          echo "youtube_version=${youtube_version}" >> $GITHUB_OUTPUT
        env:
          YOUTUBE_URL: ${{ env.URL_YT }}

      - name: Fix compiling & Build Package
        id: build_package
        run: |
          cd main
          sed -i '' "s/^BUNDLE_ID .*/BUNDLE_ID = ${{ inputs.bundle_id }}/" Makefile || echo "BUNDLE_ID = ${{ inputs.bundle_id }}" >> Makefile
          sed -i '' "s/^DISPLAY_NAME .*/DISPLAY_NAME = ${{ inputs.app_name }}/" Makefile || echo "DISPLAY_NAME = ${{ inputs.app_name }}" >> Makefile
          sed -i '' "s/^export TARGET .*/export TARGET = iphone:clang:${{ inputs.sdk_version }}:16.0/" Makefile || echo "export TARGET = iphone:clang:${{ inputs.sdk_version }}:16.0" >> Makefile

          # YTUHD flag
          if [ "${{ inputs.ytuhd }}" = "true" ]; then
            echo "YTUHD_ENABLED=1" >> Makefile
          else
            echo "YTUHD_ENABLED=0" >> Makefile
          fi
          # iSponsorBlock flag (DISABLED by default)
          if [ "${{ inputs.sponsorblock }}" = "true" ]; then
            echo "SPONSORBLOCK_ENABLED=1" >> Makefile
          else
            echo "SPONSORBLOCK_ENABLED=0" >> Makefile
          fi
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT
        env:
          THEOS: ${{ github.workspace }}/theos
          UYOU_VERSION: ${{ inputs.uyou_version }}

      - name: Clone Open in YouTube (Safari Extension)
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git OpenYouTubeSafariExtension
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout --quiet
          mv *.appex ..
      - name: Normalize Extension Bundle ID for SideStore
        run: |
          set -euo pipefail
          PARENT_BUNDLE="${{ inputs.bundle_id }}"
          ORIG_PREFIX="com.google.ios.youtube"
          echo "Normalizing extension CFBundleIdentifier(s) to use parent prefix: ${PARENT_BUNDLE}"
          update_plist_id() {
            PLIST_PATH="$1"
            if [ ! -f "$PLIST_PATH" ]; then return; fi
            /usr/bin/plutil -convert xml1 "$PLIST_PATH" >/dev/null 2>&1 || true
            CURRENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_PATH" 2>/dev/null || true)
            if [ -z "$CURRENT_ID" ]; then return; fi
            if [[ "$CURRENT_ID" == "$ORIG_PREFIX"* ]]; then
              SUFFIX="${CURRENT_ID#${ORIG_PREFIX}.}"
              [ "$SUFFIX" = "$CURRENT_ID" ] && SUFFIX="Extension"
              NEW_ID="${PARENT_BUNDLE}.${SUFFIX}"
              echo "Updating $PLIST_PATH: $CURRENT_ID -> $NEW_ID"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_ID" "$PLIST_PATH" 2>/dev/null || \
                /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $NEW_ID" "$PLIST_PATH" || true
            else
              echo "Skipping $PLIST_PATH (prefix mismatch): $CURRENT_ID"
            fi
          }
          for appex in *.appex; do
            if [ -d "$appex" ]; then
              update_plist_id "$appex/Info.plist"
              find "$appex" -type f \( -name "*.plist" -o -name "*.entitlements" \) | while read -r f; do
                /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
                grep -q "$ORIG_PREFIX" "$f" 2>/dev/null && perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
              done
            fi
          done
          APP_BUNDLE_DIR="main/Payload/YouTube.app"
          [ -d "$APP_BUNDLE_DIR/Extensions" ] && rm -rf "$APP_BUNDLE_DIR/Extensions"
          find "$APP_BUNDLE_DIR" -depth -type d -name "*AppMigration*" -exec rm -rf {} + 2>/dev/null || true
          find "$APP_BUNDLE_DIR" -type d -name "*.appex" | while read -r appex; do
            update_plist_id "$appex/Info.plist"
            find "$appex" -type f \( -name "*.plist" -o -name "*.entitlements" \) | while read -r f; do
              /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
              grep -q "$ORIG_PREFIX" "$f" 2>/dev/null && perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
            done
          done
          find "$APP_BUNDLE_DIR" -type f \( -name "*.plist" -o -name "*.entitlements" \) | while read -r f; do
            /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
            grep -q "$ORIG_PREFIX" "$f" 2>/dev/null && perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
          done
          echo "Normalization complete."
        shell: bash

      - name: Inject Tweaks Into IPA
        run: |
          IPA_IN="main/packages/${{ steps.build_package.outputs.package }}"
          OUTNAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ inputs.uyou_version }}.ipa"
          tweaks="OpenYouTubeSafariExtension.appex"
          for f in main/packages/*.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i "$IPA_IN" -o "$OUTNAME" -uwef $tweaks -n "${{ inputs.app_name }}" -b ${{ inputs.bundle_id }}

      # ===== RESIGN WITH VALIDATED CERTIFICATE (ROBUST) =====
      - name: Resign IPA with Validated Certificate
        if: env.CERT_VALIDATED == 'true'
        env:
          CERT_IDENTITY: ${{ env.CERT_IDENTITY }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          set -euo pipefail
          echo "=== RESIGNING IPA ==="

          # 1. Restore validated assets
          cp cert_cache/cert.p12 .
          cp cert_cache/profile.mobileprovision .
          cp cert_cache/cert_password.txt .

          PASSWORD=$(cat cert_password.txt)
          # Ensure password is raw (no trailing newline)
          PASSWORD=$(printf '%s' "$PASSWORD")

          echo "Using Certificate Identity: $CERT_IDENTITY"
          echo "Password Length: ${#PASSWORD}"

          # 2. Setup Keychain
          security create-keychain -p "build123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build123" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

          # 3. Import Certificate (Handle Legacy vs Standard)
          echo "Importing certificate..."
          IMPORT_SUCCESS=0

          # Try direct import first
          if [ -z "$PASSWORD" ]; then
            security import cert.p12 -k build.keychain -T /usr/bin/codesign -A && IMPORT_SUCCESS=1
          else
            security import cert.p12 -k build.keychain -P "$PASSWORD" -T /usr/bin/codesign -A && IMPORT_SUCCESS=1
          fi

          # If failed, try legacy conversion on the fly
          if [ $IMPORT_SUCCESS -eq 0 ]; then
            echo "Direct import failed. Attempting legacy PBE-SHA1-3DES conversion..."
            TMP_PEM=$(mktemp)
            TMP_P12=$(mktemp)

            if [ -z "$PASSWORD" ]; then
              openssl pkcs12 -in cert.p12 -out "$TMP_PEM" -nodes -passin pass: 2>/dev/null
            else
              openssl pkcs12 -in cert.p12 -out "$TMP_PEM" -nodes -passin pass:"$PASSWORD" 2>/dev/null
            fi

            if [ -s "$TMP_PEM" ]; then
              openssl pkcs12 -export -in "$TMP_PEM" -out "$TMP_P12" -passout pass:"$PASSWORD" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES 2>/dev/null

              if [ -s "$TMP_P12" ]; then
                if [ -z "$PASSWORD" ]; then
                  security import "$TMP_P12" -k build.keychain -T /usr/bin/codesign -A && IMPORT_SUCCESS=1
                else
                  security import "$TMP_P12" -k build.keychain -P "$PASSWORD" -T /usr/bin/codesign -A && IMPORT_SUCCESS=1
                fi
                [ $IMPORT_SUCCESS -eq 1 ] && mv "$TMP_P12" cert.p12
              fi
            fi
            rm -f "$TMP_PEM" "$TMP_P12"
          fi

          if [ $IMPORT_SUCCESS -eq 0 ]; then
            echo "❌ FATAL: Certificate import failed completely."
            echo "--- Debug Info ---"
            security find-identity -v
            openssl pkcs12 -in cert.p12 -info -nokeys -passin pass:"$PASSWORD" 2>&1 | head -20
            exit 1
          fi

          # Allow codesign access
          security set-key-partition-list -S apple-tool:,apple: -s -k "build123" build.keychain

          # 4. Verify Identity is present
          ACTIVE_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -E "iPhone Developer|iPhone Distribution|Apple Development|Apple Distribution" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')

          if [ -z "$ACTIVE_IDENTITY" ]; then
            echo "❌ Identity not found in keychain after import!"
            security find-identity -v build.keychain
            exit 1
          fi

          echo "✅ Active Signing Identity: $ACTIVE_IDENTITY"

          # 5. Extract Entitlements
          security cms -D -i profile.mobileprovision > provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' provision.plist > entitlements.plist

          # Add YouTube Required Entitlements
          PLIST_BUDDY=/usr/libexec/PlistBuddy
          add_ent() { $PLIST_BUDDY -c "Add :$1 $2 $3" entitlements.plist 2>/dev/null || $PLIST_BUDDY -c "Set :$1 $3" entitlements.plist 2>/dev/null || true; }

          add_ent "com.apple.developer.coremedia.allow-alternative-video-decoder-selection" bool true
          add_ent "com.apple.developer.declared-age-range" string "14+"
          add_ent "com.apple.developer.device-information.user-assigned-device-name" bool true
          add_ent "com.apple.developer.group-session" bool true
          add_ent "com.apple.developer.networking.multicast" bool true
          add_ent "com.apple.developer.storekit.request-data" bool true
          add_ent "get-task-allow" bool false
          add_ent "application-identifier" string "${TEAM_ID}.${{ inputs.bundle_id }}"

          # 6. Unzip, Strip, Resign
          IPA_NAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ inputs.uyou_version }}.ipa"
          APP_DIR="Payload/YouTube.app"

          mkdir -p resign_work
          cd resign_work
          unzip -q "../$IPA_NAME"

          # Embed Profile
          cp ../profile.mobileprovision "$APP_DIR/embedded.mobileprovision"

          # Strip All
          echo "Stripping signatures..."
          find "$APP_DIR" -name "*.dylib" -exec codesign --remove-signature {} + 2>/dev/null || true
          find "$APP_DIR" -name "*.framework" -type d | while read d; do b=$(basename "$d" .framework); [ -f "$d/$b" ] && codesign --remove-signature "$d/$b"; done 2>/dev/null || true
          find "$APP_DIR" -name "*.appex" -type d -exec codesign --remove-signature {} + 2>/dev/null || true
          codesign --remove-signature "$APP_DIR/YouTube" 2>/dev/null || true

          # Resign Dependencies (NO Entitlements)
          echo "Resigning dylibs/frameworks/appex..."
          find "$APP_DIR" -name "*.dylib" -exec codesign -f -s "$ACTIVE_IDENTITY" {} + 2>/dev/null || true
          find "$APP_DIR" -name "*.framework" -type d | while read d; do b=$(basename "$d" .framework); [ -f "$d/$b" ] && codesign -f -s "$ACTIVE_IDENTITY" "$d/$b"; done 2>/dev/null || true
          find "$APP_DIR" -name "*.appex" -type d -exec codesign -f -s "$ACTIVE_IDENTITY" {} + 2>/dev/null || true

          # Resign Main Binary (WITH Entitlements)
          echo "Resigning main binary with entitlements..."
          codesign -f -s "$ACTIVE_IDENTITY" --entitlements ../entitlements.plist "$APP_DIR/YouTube"

          # Verify
          echo "=== Verification ==="
          codesign -dvvv "$APP_DIR/YouTube" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR/YouTube" 2>&1 | tail -5

          # Repack
          echo "Repacking IPA..."
          zip -q -r "../$IPA_NAME" "$APP_DIR"
          cd ..
          rm -rf resign_work

          echo "✅ RESIGN COMPLETE"

      - name: Strip Unresignable Extensions From Final IPA
        id: strip_ipa
        run: |
          set -euo pipefail
          OUTNAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ inputs.uyou_version }}.ipa"
          if [ ! -f "$OUTNAME" ]; then
            OUTNAME="$(basename "$(find . -maxdepth 3 -name 'uYouEnhanced_*.ipa' -print -quit)")"
          fi
          echo "Final IPA: $OUTNAME"
          echo "--- .appex bundles contained in final IPA ---"
          unzip -Z1 "$OUTNAME" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | tee appex_list.txt || true
          BAD="$(grep -v '/PlugIns/' appex_list.txt || true)"
          if [ -n "$BAD" ]; then
            echo "Removing unresignable extensions:"
            printf '%s\n' "$BAD"
            printf '%s\n' "$BAD" | while IFS= read -r d; do
              zip -q -d "$OUTNAME" "${d}/*" || true
            done
          else
            echo "All extensions are under PlugIns/ - OK for SideStore."
          fi
          mkdir -p main/packages
          cp -f "$OUTNAME" "main/packages/$OUTNAME"
          find main/packages -maxdepth 1 -name "*.ipa" ! -name "$OUTNAME" -delete || true
          echo "Final SideStore-compatible IPA: main/packages/$OUTNAME"
          echo "final_ipa=$OUTNAME" >> "$GITHUB_OUTPUT"
      - name: Register Alternate App Icons
        run: |
          set -euo pipefail
          IPA="main/packages/${{ steps.strip_ipa.outputs.final_ipa }}"
          rm -rf iconwork && mkdir -p iconwork && cd iconwork
          unzip -q "../$IPA" "Payload/YouTube.app/Info.plist"
          PLIST="Payload/YouTube.app/Info.plist"
          ICON_SRC="../main/Localizations/uYouPlus.bundle/AppIcons"
          PB=/usr/libexec/PlistBuddy
          for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
            $PB -c "Add :$ROOT dict" "$PLIST" 2>/dev/null || true
            $PB -c "Add :$ROOT:CFBundleAlternateIcons dict" "$PLIST" 2>/dev/null || true
          done
          for f in "$ICON_SRC"/*.png; do
            NAME="$(basename "$f" .png)"
            cp -f "$f" "Payload/YouTube.app/$NAME.png"
            for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME dict" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:0 string $NAME" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconName string $NAME" "$PLIST" 2>/dev/null || true
            done
            echo "Registered alternate icon: $NAME"
          done
          $PB -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" | head -20
          zip -q "../$IPA" "$PLIST" Payload/YouTube.app/*.png
          cd .. && rm -rf iconwork
          echo "Alternate icons registered into $(basename "$IPA")"
      - name: Rebrand IPA Filename (3.0.4 -> 3.0.5)
        run: |
          set -euo pipefail
          cd main/packages
          OLD="${{ steps.strip_ipa.outputs.final_ipa }}"
          NEW="${OLD//3.0.4/3.0.5}"
          if [ "$OLD" != "$NEW" ] && [ -f "$OLD" ]; then
            mv "$OLD" "$NEW"
            echo "Renamed: $OLD -> $NEW"
          else
            echo "No 3.0.4 in filename or file missing: $OLD"
          fi
          echo "RENAMED_IPA=$NEW" >> "$GITHUB_ENV"
      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: uYouEnhanced_${{ env.YOUTUBE_VERSION }}_${{ env.UYOU_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ env.RENAMED_IPA || steps.strip_ipa.outputs.final_ipa }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          tag_name: v${{ env.YOUTUBE_VERSION }}-${{ env.UYOU_VERSION }}-(${{ github.run_number }})
          name: v${{ env.YOUTUBE_VERSION }}-${{ env.UYOU_VERSION }}-(${{ github.run_number }})
          files: main/packages/*.ipa
          draft: true
