# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml
name: ENTITLE GONE Sign Stripped Build and Release 

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "18.6"
        required: true
        type: string
      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL of the decrypted YouTube IPA"
        default: "https://www.dropbox.com/scl/fi/j8gc6moqvudfo8xetcf2o/YouTube.ipa?rlkey=h452vc9ky73935kcwqlozjxv5&dl=0"
        required: true
        type: string
      mobileprovision_url: 
        description: "Direct URL to the .mobileprovision file"
        default: "https://flarestore.vip/api/cert/8e9160aa-414/provision/0?udid=00008150-0004056C0200401C"
        required: true
        type: string
      p12_url:
        description: "Direct URL to the .p12 certificate file"
        default: "https://flarestore.vip/api/cert/8e9160aa-414/p12?udid=00008150-0004056C0200401C"
        required: true
        type: string
      p12_password:
        description: "Password for the .p12 certificate"
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the app name"
        default: "YouTube"
        required: true
        type: string
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean
      ytuhd:
        description: "Include YTUHD"
        default: false
        required: false
        type: boolean
      sponsorblock:
        description: "Include iSponsorBlock (KEEP IT DISABLED - may crash the app.)"
        default: true
        required: false
        type: boolean




concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      # ============================================
      # STEP 1: VALIDATE CERTIFICATE EARLY (FAIL FAST)
      # ============================================
      - name: Validate Certificate and Profile Early
        run: |
          echo "=== VALIDATING CERTIFICATE EARLY ==="
          echo "This checks if the certificate works BEFORE spending time building"
          
          # Download certificate and profile
          wget -q "${{ inputs.p12_url }}" -O cert.p12
          wget -q "${{ inputs.mobileprovision_url }}" -O profile.mobileprovision
          echo "${{ inputs.p12_password }}" > cert_password.txt
          
          # === Check file types ===
          echo "=== Checking file types ==="
          if file cert.p12 | grep -q "HTML"; then
            echo "❌ Certificate is HTML - corrupted or wrong URL"
            exit 1
          fi
          if file profile.mobileprovision | grep -q "HTML"; then
            echo "❌ Profile is HTML - corrupted or wrong URL"
            exit 1
          fi
          echo "✅ Files are valid file types"
          
          # === Test certificate with OpenSSL ===
          echo "=== Testing certificate with OpenSSL ==="
          if openssl pkcs12 -in cert.p12 -nokeys -clcerts -passin pass:"${{ inputs.p12_password }}" 2>&1 | grep -qi "error"; then
            echo "❌ Certificate failed OpenSSL test - wrong password or corrupt"
            echo "Trying common passwords..."
            for PASS in "flarestore" "FlareStore" "flareStore" "FLARESTORE" "FlareStore123" "123456" "password" ""; do
              if [ -z "$PASS" ]; then
                echo "Trying: (no password)"
                if openssl pkcs12 -in cert.p12 -nokeys -clcerts -passin pass: 2>/dev/null; then
                  echo "✅ SUCCESS! No password needed"
                  echo "" > cert_password.txt
                  break
                fi
              else
                echo "Trying: $PASS"
                if openssl pkcs12 -in cert.p12 -nokeys -clcerts -passin pass:"$PASS" 2>/dev/null; then
                  echo "✅ SUCCESS! Password: $PASS"
                  echo "$PASS" > cert_password.txt
                  break
                fi
              fi
            done
          fi
          echo "✅ Certificate valid"
          
          # === Test provisioning profile ===
          echo "=== Testing provisioning profile ==="
          security cms -D -i profile.mobileprovision > provision.plist 2>/dev/null
          if [ ! -s provision.plist ]; then
            echo "❌ Failed to extract provisioning profile"
            exit 1
          fi
          
          # Extract Team ID and App ID for verification
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' provision.plist 2>/dev/null)
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' provision.plist 2>/dev/null)
          echo "Team ID: $TEAM_ID"
          echo "App ID: $APP_ID"
          
          echo "✅ All certificate and profile checks passed!"
          echo "✅ Proceeding with full build..."
          
          # === Save the validated files for later ===
          mkdir -p cert_cache
          cp cert.p12 cert_cache/
          cp profile.mobileprovision cert_cache/
          cp cert_password.txt cert_cache/
          
          # Export validation status for later steps
          echo "CERT_VALIDATED=true" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          
          echo "✅ EARLY VALIDATION COMPLETE - Build will now proceed"
    
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      
      - name: Install Dependencies
        run: |
          brew install ldid dpkg make wget unzip jq pipx
      - name: Set PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v6
        with:
          path: theos/sdks/
          key: iOS-${{ inputs.sdk_version }}-SDK

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/ sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout --quiet
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v7
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Fix Theos broken pipe issue
        run: |
          find $THEOS -name "*.sh" -type f | while read -r SCRIPT; do
            if grep -q '| head' "$SCRIPT" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$SCRIPT" 2>/dev/null || true
              echo "Patched: $SCRIPT"
            fi
          done
          find $THEOS -name "*.mk" -type f | while read -r MK; do
            if grep -q '| head' "$MK" 2>/dev/null; then
              sed -i '' 's/| head/2>\/dev\/null | head/g' "$MK" 2>/dev/null || true
              echo "Patched: $MK"
            fi
          done
          echo "Broken pipe fixes applied"
      - name: Install cyan and tbd
        run: |
          pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          wget --quiet "https://github.com/inoahdev/tbd/releases/download/2.2/tbd-mac" -O /usr/local/bin/tbd
          chmod +x /usr/local/bin/tbd
      - name: Hash YT ipa url
        run: |
          URL_YT="$(jq -r '.inputs.decrypted_youtube_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV
      - name: Prepare YouTube iPA
        id: prepare_youtube
        run: |
          wget "$YOUTUBE_URL" --quiet -O main/YouTube.ipa
          cd main
          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          youtube_version=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "YT_VERSION=$youtube_version" >> $GITHUB_ENV
          echo "youtube_version=${youtube_version}" >> $GITHUB_OUTPUT
        env:
          YOUTUBE_URL: ${{ env.URL_YT }}

      - name: Fix compiling & Build Package
        id: build_package
        run: |
          cd main
          sed -i '' "s/^BUNDLE_ID .*/BUNDLE_ID = ${{ inputs.bundle_id }}/" Makefile || echo "BUNDLE_ID = ${{ inputs.bundle_id }}" >> Makefile
          sed -i '' "s/^DISPLAY_NAME .*/DISPLAY_NAME = ${{ inputs.app_name }}/" Makefile || echo "DISPLAY_NAME = ${{ inputs.app_name }}" >> Makefile
          sed -i '' "s/^export TARGET .*/export TARGET = iphone:clang:${{ inputs.sdk_version }}:16.0/" Makefile || echo "export TARGET = iphone:clang:${{ inputs.sdk_version }}:16.0" >> Makefile
          
          # YTUHD flag
          if [ "${{ inputs.ytuhd }}" = "true" ]; then
            echo "YTUHD_ENABLED=1" >> Makefile
          else
            echo "YTUHD_ENABLED=0" >> Makefile
          fi
          # iSponsorBlock flag (DISABLED by default)
          if [ "${{ inputs.sponsorblock }}" = "true" ]; then
            echo "SPONSORBLOCK_ENABLED=1" >> Makefile
          else
            echo "SPONSORBLOCK_ENABLED=0" >> Makefile
          fi
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1
          echo "package=$(ls -t packages | head -n1)" >> $GITHUB_OUTPUT
        env:
          THEOS: ${{ github.workspace }}/theos
          UYOU_VERSION: ${{ inputs.uyou_version }}

      - name: Clone Open in YouTube (Safari Extension)
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git OpenYouTubeSafariExtension
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout --quiet
          mv *.appex ..
      - name: Normalize Extension Bundle ID for SideStore
        run: |
          set -euo pipefail
          PARENT_BUNDLE="${{ inputs.bundle_id }}"
          ORIG_PREFIX="com.google.ios.youtube"
          echo "Normalizing extension CFBundleIdentifier(s) to use parent prefix: ${PARENT_BUNDLE}"
          update_plist_id() {
            PLIST_PATH="$1"
            if [ ! -f "$PLIST_PATH" ]; then
              return
            fi
            if /usr/bin/plutil -convert xml1 "$PLIST_PATH" >/dev/null 2>&1; then
              :
            fi
            CURRENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST_PATH" 2>/dev/null || true)
            if [ -z "$CURRENT_ID" ]; then
              return
            fi
            if [[ "$CURRENT_ID" == "$ORIG_PREFIX"* ]]; then
              SUFFIX="${CURRENT_ID#${ORIG_PREFIX}.}"
              if [ "$SUFFIX" = "$CURRENT_ID" ]; then
                SUFFIX="Extension"
              fi
              NEW_ID="${PARENT_BUNDLE}.${SUFFIX}"
              echo "Updating $PLIST_PATH: $CURRENT_ID -> $NEW_ID"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_ID" "$PLIST_PATH" || \
                /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $NEW_ID" "$PLIST_PATH" || true
            else
              echo "Skipping $PLIST_PATH (does not start with $ORIG_PREFIX): $CURRENT_ID"
            fi
          }
          for appex in *.appex; do
            if [ -d "$appex" ]; then
              PLIST="$appex/Info.plist"
              update_plist_id "$PLIST"
              find "$appex" -type f -name "*.plist" -o -name "*.entitlements" | while read -r f; do
                /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
                if grep -q "$ORIG_PREFIX" "$f" >/dev/null 2>&1; then
                  echo "Replacing occurrences in $f"
                  perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
                fi
              done
            fi
          done
          APP_BUNDLE_DIR="main/Payload/YouTube.app"
          APP_EXTENSIONS_DIR="$APP_BUNDLE_DIR/Extensions"
          if [ -d "$APP_EXTENSIONS_DIR" ]; then
            echo "Removing ExtensionKit-style extensions (unresignable):"
            ls -1 "$APP_EXTENSIONS_DIR" || true
            rm -rf "$APP_EXTENSIONS_DIR"
          fi
          find "$APP_BUNDLE_DIR" -depth -type d -name "*AppMigration*" -print0 2>/dev/null \
            | xargs -0 -I{} sh -c 'echo "Removing {}"; rm -rf "{}"' || true
          if [ -d "$APP_BUNDLE_DIR" ]; then
            find "$APP_BUNDLE_DIR" -type d -name "*.appex" | while read -r appex; do
              if [ -d "$appex" ]; then
                PLIST="$appex/Info.plist"
                update_plist_id "$PLIST"
                find "$appex" -type f \( -name "*.plist" -o -name "*.entitlements" \) | while read -r f; do
                  /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
                  if grep -q "$ORIG_PREFIX" "$f" >/dev/null 2>&1; then
                    echo "Replacing occurrences in $f"
                    perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
                  fi
                done
              fi
            done
          fi
          MAIN_APP_DIR="main/Payload/YouTube.app"
          if [ -d "$MAIN_APP_DIR" ]; then
            find "$MAIN_APP_DIR" -type f -name "*.plist" -o -name "*.entitlements" | while read -r f; do
              /usr/bin/plutil -convert xml1 "$f" >/dev/null 2>&1 || true
              if grep -q "$ORIG_PREFIX" "$f" >/dev/null 2>&1; then
                echo "Replacing occurrences in $f"
                perl -0777 -pe "s/\Q${ORIG_PREFIX}\E/${PARENT_BUNDLE}/g" -i "$f" || true
              fi
            done
          fi
          echo "Normalization complete."
        shell: bash

      - name: Inject Tweaks Into IPA
        run: |
          IPA_IN="main/packages/${{ steps.build_package.outputs.package }}"
          OUTNAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ inputs.uyou_version }}.ipa"
          tweaks="OpenYouTubeSafariExtension.appex"
          for f in main/packages/*.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i "$IPA_IN" -o "$OUTNAME" -uwef $tweaks -n "${{ inputs.app_name }}" -b ${{ inputs.bundle_id }}

      # ===== RESIGN WITH VALIDATED CERTIFICATE =====
   
      - name: Resign Everything with Validated Certificate
        env:
          CERT_VALIDATED: true
          TEAM_ID: D56Z6846H3
        run: |
          # === Use the certificate we already validated ===
          echo "=== Using pre-validated certificate ==="
          cp cert_cache/cert.p12 .
          cp cert_cache/profile.mobileprovision .
          cp cert_cache/cert_password.txt .
          
          # === Import certificate into keychain ===
          echo "=== Creating keychain ==="
          security create-keychain -p temp123 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp123 build.keychain
          
          echo "=== Importing certificate ==="
          PASSWORD=$(cat cert_password.txt)
          if [ -z "$PASSWORD" ]; then
            # Import without password
            security import cert.p12 -k build.keychain -T /usr/bin/codesign -A
          else
            # Import with password
            security import cert.p12 -k build.keychain -P "$PASSWORD" -T /usr/bin/codesign -A
          fi
          
          security set-key-partition-list -S apple-tool:,apple: -s -k temp123 build.keychain
          
          # === Find the certificate identity ===
          echo "=== Finding certificate ==="
          CERT_IDENTITY=$(security find-identity -v -p basic | grep -E "Apple Development|iPhone Developer|Apple Distribution|iPhone Distribution" | head -1 | awk -F'"' '{print $2}')
          
          if [ -z "$CERT_IDENTITY" ]; then
            echo "❌ No certificate identity found!"
            security find-identity -v -p basic
            exit 1
          fi
          echo "Using certificate: $CERT_IDENTITY"
          
          # === Extract entitlements ===
          echo "=== Extracting entitlements ==="
          security cms -D -i profile.mobileprovision > provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' provision.plist > entitlements.plist
          
          APP_DIR="Payload/YouTube.app"
          IPA_NAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ inputs.uyou_version }}.ipa"
          
          # === Unzip IPA ===
          echo "=== Unzipping IPA ==="
          mkdir -p resign_work
          cd resign_work
          unzip -q "../$IPA_NAME"
          
          # === Embed provisioning profile ===
          cp ../profile.mobileprovision "$APP_DIR/embedded.mobileprovision"
          
          # === Strip ALL signatures ===
          echo "=== Stripping signatures ==="
          find "$APP_DIR" -name "*.dylib" -type f -exec codesign --remove-signature {} \; 2>/dev/null || true
          find "$APP_DIR" -name "*.framework" -type d | while read dir; do
            binary=$(basename "$dir" .framework)
            [ -f "$dir/$binary" ] && codesign --remove-signature "$dir/$binary" 2>/dev/null || true
          done
          find "$APP_DIR" -name "*.appex" -type d -exec codesign --remove-signature {} \; 2>/dev/null || true
          codesign --remove-signature "$APP_DIR/YouTube" 2>/dev/null || true
          
          # === Re-sign dylibs (WITHOUT entitlements) ===
          echo "=== Re-signing dylibs ==="
          find "$APP_DIR" -name "*.dylib" -type f -exec codesign -f -s "$CERT_IDENTITY" {} \;
          
          # === Re-sign frameworks (WITHOUT entitlements) ===
          echo "=== Re-signing frameworks ==="
          find "$APP_DIR" -name "*.framework" -type d | while read dir; do
            binary=$(basename "$dir" .framework)
            [ -f "$dir/$binary" ] && codesign -f -s "$CERT_IDENTITY" "$dir/$binary"
          done
          
          # === Re-sign app extensions (WITHOUT entitlements) ===
          echo "=== Re-signing app extensions ==="
          find "$APP_DIR" -name "*.appex" -type d -exec codesign -f -s "$CERT_IDENTITY" {} \;
          
          # === Add YouTube's missing entitlements ===
          echo "=== Adding YouTube-specific entitlements ==="
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.coremedia.allow-alternative-video-decoder-selection bool true" ../entitlements.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.declared-age-range string '14+'" ../entitlements.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.device-information.user-assigned-device-name bool true" ../entitlements.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.group-session bool true" ../entitlements.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.networking.multicast bool true" ../entitlements.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.storekit.request-data bool true" ../entitlements.plist 2>/dev/null || true
          
          # === Sign main binary WITH entitlements ===
          echo "=== Signing main binary ==="
          codesign -f -s "$CERT_IDENTITY" --entitlements ../entitlements.plist "$APP_DIR/YouTube"
          
          # === Verify signatures ===
          echo "=== Verifying signatures ==="
          codesign -d --verbose=2 "$APP_DIR/YouTube"
          
          # === Repack IPA ===
          echo "=== Repacking IPA ==="
          zip -q -r "../$IPA_NAME" "$APP_DIR"
          cd ..
          rm -rf resign_work
          
          echo "✅ All components resigned successfully"
        shell: /bin/bash        
    
      - name: Strip Unresignable Extensions From Final IPA
        id: strip_ipa
        run: |
          set -euo pipefail
          OUTNAME="uYouEnhanced_${{ env.YT_VERSION }}_v${{ inputs.uyou_version }}.ipa"
          if [ ! -f "$OUTNAME" ]; then
            OUTNAME="$(basename "$(find . -maxdepth 3 -name 'uYouEnhanced_*.ipa' -print -quit)")"
          fi
          echo "Final IPA: $OUTNAME"
          echo "--- .appex bundles contained in final IPA ---"
          unzip -Z1 "$OUTNAME" | grep '\.appex/' | sed 's|^\(.*\.appex\)/.*|\1|' | sort -u | tee appex_list.txt || true
          BAD="$(grep -v '/PlugIns/' appex_list.txt || true)"
          if [ -n "$BAD" ]; then
            echo "Removing unresignable extensions:"
            printf '%s\n' "$BAD"
            printf '%s\n' "$BAD" | while IFS= read -r d; do
              zip -q -d "$OUTNAME" "${d}/*" || true
            done
          else
            echo "All extensions are under PlugIns/ - OK for SideStore."
          fi
          mkdir -p main/packages
          cp -f "$OUTNAME" "main/packages/$OUTNAME"
          find main/packages -maxdepth 1 -name "*.ipa" ! -name "$OUTNAME" -delete || true
          echo "Final SideStore-compatible IPA: main/packages/$OUTNAME"
          echo "final_ipa=$OUTNAME" >> "$GITHUB_OUTPUT"
      - name: Register Alternate App Icons
        run: |
          set -euo pipefail
          IPA="main/packages/${{ steps.strip_ipa.outputs.final_ipa }}"
          rm -rf iconwork && mkdir -p iconwork && cd iconwork
          unzip -q "../$IPA" "Payload/YouTube.app/Info.plist"
          PLIST="Payload/YouTube.app/Info.plist"
          ICON_SRC="../main/Localizations/uYouPlus.bundle/AppIcons"
          PB=/usr/libexec/PlistBuddy
          # Create intermediate dicts FIRST (PlistBuddy cannot nest-create).
          for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
            $PB -c "Add :$ROOT dict" "$PLIST" 2>/dev/null || true
            $PB -c "Add :$ROOT:CFBundleAlternateIcons dict" "$PLIST" 2>/dev/null || true
          done
          for f in "$ICON_SRC"/*.png; do
            NAME="$(basename "$f" .png)"
            cp -f "$f" "Payload/YouTube.app/$NAME.png"
            for ROOT in CFBundleIcons "CFBundleIcons~ipad"; do
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME dict" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles array" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconFiles:0 string $NAME" "$PLIST" 2>/dev/null || true
              $PB -c "Add :$ROOT:CFBundleAlternateIcons:$NAME:CFBundleIconName string $NAME" "$PLIST" 2>/dev/null || true
            done
            echo "Registered alternate icon: $NAME"
          done
          $PB -c "Print :CFBundleIcons:CFBundleAlternateIcons" "$PLIST" | head -20
          zip -q "../$IPA" "$PLIST" Payload/YouTube.app/*.png
          cd .. && rm -rf iconwork
          echo "Alternate icons registered into $(basename "$IPA")"
      - name: Rebrand IPA Filename (3.0.4 -> 3.0.5)
        run: |
          set -euo pipefail
          cd main/packages
          OLD="${{ steps.strip_ipa.outputs.final_ipa }}"
          NEW="${OLD//3.0.4/3.0.5}"
          if [ "$OLD" != "$NEW" ] && [ -f "$OLD" ]; then
            mv "$OLD" "$NEW"
            echo "Renamed: $OLD -> $NEW"
          else
            echo "No 3.0.4 in filename or file missing: $OLD"
          fi
          echo "RENAMED_IPA=$NEW" >> "$GITHUB_ENV"
      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v7
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: uYouEnhanced_${{ env.YOUTUBE_VERSION }}_${{ env.UYOU_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ env.RENAMED_IPA || steps.strip_ipa.outputs.final_ipa }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          tag_name: v${{ env.YOUTUBE_VERSION }}-${{ env.UYOU_VERSION }}-(${{ github.run_number }})
